benchmark: taylor_green
seed: 0
deterministic: true
device: auto

benchmark_params:
  reynolds: 100.0
  x_min: 0.0
  x_max: 6.283185307179586
  y_min: 0.0
  y_max: 6.283185307179586
  t_min: 0.0
  t_max: 1.0
  evaluation_time: 1.0
  amplitude: 1.0

pde:
  steady: false

model:
  architecture: mlp
  input_dim: 3
  output_dim: 3
  hidden_layers: [96, 96, 96, 96]
  activation: tanh
  t_min: 0.0
  t_max: 1.0

optimizer:
  name: adam
  lr: 0.001
  final_repair:
    enabled: false

training:
  adaptive_cycles: 4
  epochs_per_cycle: 100
  log_every: 25
  n_collocation: 4096
  n_boundary: 1024
  n_data: 1024
  weights:
    pde: 1.0
    momentum_u: 1.0
    momentum_v: 1.0
    continuity: 1.0
    bc: 2.0
    u: 2.0
    v: 2.0
    p: 1.0
    omega: 0.0
    pressure_gradient: 0.0

validation:
  nx: 48
  ny: 48

test:
  nx: 64
  ny: 64

diagnostics:
  mode: full_reference
  variables:
    - continuity_residual
    - momentum_u_residual
    - momentum_v_residual
    - aggregate_pde_residual
    - boundary_violation
  aggregation: mean
  normalization: percentile
  aggregation_percentile: 90.0
  ema_rho: 0.7

patches:
  nx_patches: 4
  ny_patches: 4
  nt_patches: 4

weak_regions:
  percentile_threshold: 75.0
  top_k_per_variable: 1
  min_active_patches: 1
  max_active_patches: 6
  persistence_cycles: 1

local_controller:
  enabled: true
  constrained: true
  trial_epochs: 10
  max_actions_per_cycle: 3
  initial_strength: 0.30
  warmup_cycles: 1

sampling:
  mixture:
    uniform: 0.50
    pde_residual: 0.25
    pressure_vorticity: 0.10
    velocity: 0.10
    boundary: 0.05

experiments:
  root: experiments/vara_v2/taylor_green
