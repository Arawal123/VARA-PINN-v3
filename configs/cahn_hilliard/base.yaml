benchmark:
  name: cahn_hilliard
  bounds: [0.0, 1.0, 0.0, 1.0]
  t_bounds: [0.0, 1.0]
  epsilon: 0.04
  mobility: 1.0
  delta: 0.000001
  sparse_fraction: 0.02
  sparse_seed: 0

model:
  input_dim: 3
  output_dim: 2
  hidden_layers: [96, 96, 96, 96, 96]
  activation: tanh

training:
  total_steps: 4000
  n_collocation: 2048
  n_boundary: 512
  n_initial: 512
  n_sparse_data: 256
  lr: 0.001
  gradient_clip: 10.0
  weights:
    ch_residual: 1.0
    chemical_potential_residual: 0.5
    bc_u: 8.0
    bc_mu: 0.5
    ic_u: 8.0
    ic_mu: 0.5
    sparse_u_mse: 20.0
    sparse_mu_mse: 0.0
    phase_range_penalty: 1.0
    interface_proxy_regularization: 0.0

losses:
  mu_support_only: true
  mu_priority_max: 0.5
  mu_local_multiplier_max: 1.25

patches:
  nx_patches: 5
  ny_patches: 5
  nt_patches: 4

diagnostics:
  n_interior: 1024
  n_boundary: 256
  n_initial: 256
  aggregation: percentile
  aggregation_percentile: 90
  weak_percentile: 80
  top_k_per_variable: 2
  max_active_patches: 8
  persistence_cycles: 1
  interface_tau: 0.25
  interface_threshold: 0.8
  interface_beta: 2.5
  priority_weights:
    sparse_u_mismatch: 3.0
    predicted_interface_proxy: 2.5
    predicted_interface_mask: 2.5
    predicted_gradient_norm: 2.0
    ic_u_violation: 2.0
    bc_u_violation: 2.0
    phase_range_violation: 2.0
    mass_proxy_violation: 1.5
    ch_residual: 1.5
    pde_residual: 1.0
    chemical_potential_residual: 0.5
    sparse_mu_mismatch: 0.25
    bc_mu_violation: 0.25
    ic_mu_violation: 0.25

controller_v2:
  total_steps: 4000
  warmup_steps: 500
  control_blocks: 7
  block_steps: 500
  probe_steps: 25
  min_uniform_mass: 0.35
  max_patch_mass: 0.25
  multiplier_min: 0.5
  multiplier_max: 2.5
  max_candidates: 4
  prefilter_damage_ratio: 0.25
  trust_radius_initial: 0.10
  trust_radius_min: 0.025
  trust_radius_max: 0.20
  trust_expand: 1.25
  trust_shrink: 0.5
  effectiveness_ema: 0.8
  noise_floor: 0.0001
  target_noise_ceiling: 0.25
  guard_noise_ceiling: 0.10
  reliable_reward_ratio: 0.75
  counterfactual_probe_enabled: true
  counterfactual_target_margin: 0.005
  counterfactual_guard_margin: 0.02
  gradient_prefilter_enabled: true
  trust_region_enabled: true
  action_memory_enabled: true
  rollback_enabled: true
  variable_awareness_enabled: true
  sampling_redistribution_enabled: true
  local_loss_multipliers_enabled: true
  cahn_hilliard_u_first_policy: true
  max_mu_candidates_per_block: 1
  cahn_hilliard_guards:
    max_sparse_u_damage_ratio: 0.05
    max_ic_u_damage_ratio: 0.05
    max_bc_u_damage_ratio: 0.05
    max_phase_range_damage_ratio: 0.10
    max_mass_proxy_damage_ratio: 0.10
    max_interface_proxy_change_ratio: 0.10
    allow_mu_improvement_to_override_u_damage: false
  guard_metrics:
    - pde_residual_mean
    - boundary_condition_error
    - unweighted_validation_loss
    - unweighted_physics_validation_loss

evaluation:
  nx: 48
  ny: 48
  nt: 11
  chunk_size: 512
  controller_reference_metrics_enabled: false

plots:
  enabled: true

device: cpu
dtype: float32
