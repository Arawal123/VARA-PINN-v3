benchmark: lid_driven_cavity
seed: 0
deterministic: true
device: auto

benchmark_params:
  reynolds: 100.0
  x_min: 0.0
  x_max: 1.0
  y_min: 0.0
  y_max: 1.0
  lid_velocity: 1.0
  reference: ghia
  reference_path: null
  full_field_reference_path: null
  profile_only: true

pde:
  steady: true

data_supervision:
  mode: pure_pinn
  sample_fraction: 0.01
  sample_count: null
  seed: 0
  include_pressure: false
  include_vorticity: false
  exclude_near_corners: true
  boundary_margin: 1.0e-6
  corner_margin: 0.05
  oracle_label: upper_bound_only
  cfd:
    sampling:
      mode: uniform
      uniform_fraction: 0.45
      top_band_fraction: 0.25
      right_band_fraction: 0.12
      lower_core_fraction: 0.10
      left_band_fraction: 0.08

model:
  architecture: mlp
  input_dim: 2
  output_dim: 3
  hidden_layers: [64, 64, 64]
  activation: tanh

optimizer:
  name: adam
  lr: 0.001
  final_repair:
    enabled: false

training:
  pointwise_reduction: mean
  adaptive_cycles: 8
  epochs_per_cycle: 50
  log_every: 25
  n_collocation: 2048
  n_boundary: 768
  n_data: 0
  weights:
    pde: 0.0
    momentum_u: 1.0
    momentum_v: 1.0
    continuity: 1.0
    bc: 5.0
    u: 0.0
    v: 0.0
    p: 0.0
    omega: 0.0
    pressure_gradient: 0.0
    cfd_u_mse: 0.0
    cfd_v_mse: 0.0
    cfd_velocity_mse: 0.0
    cfd_p_mse: 0.0
    cfd_omega_mse: 0.0

pressure_gauge:
  weight: 0.001

validation:
  nx: 48
  ny: 48

test:
  nx: 64
  ny: 64

evaluation:
  controller_reference_metrics_enabled: false
  checkpoint_reference_metrics_enabled: false

diagnostics:
  mode: residual_only
  variables:
    - continuity_residual
    - momentum_u_residual
    - momentum_v_residual
    - aggregate_pde_residual
    - boundary_violation
  aggregation: mean
  aggregation_percentile: 90.0
  normalization: percentile
  ema_rho: 0.7

patches:
  nx_patches: 4
  ny_patches: 4
  nt_patches: 1

weak_regions:
  percentile_threshold: 75.0
  top_k_per_variable: 1
  min_active_patches: 1
  max_active_patches: 6
  persistence_cycles: 1

controller_v2:
  total_steps: 400
  warmup_steps: 100
  control_blocks: 6
  block_steps: 50
  probe_steps: 10
  gradient_probe_interior: 256
  gradient_probe_boundary: 128
  min_uniform_mass: 0.35
  max_patch_mass: 0.25
  multiplier_min: 0.5
  multiplier_max: 2.0
  max_candidates: 4
  prefilter_damage_ratio: 0.25
  trust_radius_initial: 0.10
  trust_radius_min: 0.025
  trust_radius_max: 0.20
  trust_expand: 1.25
  trust_shrink: 0.5
  effectiveness_ema: 0.8
  noise_floor: 0.0001
  target_noise_ceiling: 0.25
  guard_noise_ceiling: 0.10
  reliable_reward_ratio: 0.75
  counterfactual_probe_enabled: true
  counterfactual_target_margin: 0.005
  counterfactual_guard_margin: 0.02
  gradient_prefilter_enabled: true
  trust_region_enabled: true
  action_memory_enabled: true
  rollback_enabled: true

sampling:
  mixture:
    uniform: 0.35
    pde_residual: 0.25
    pressure_vorticity: 0.10
    velocity: 0.10
    boundary: 0.20
  cavity_boundary:
    enabled: true
    lid_fraction: 0.45
    corner_fraction: 0.25
    corner_width: 0.12

experiments:
  root: experiments/vara_v2/lid_driven_cavity
