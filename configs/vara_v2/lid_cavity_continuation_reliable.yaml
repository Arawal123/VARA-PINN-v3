# Opt-in physically guarded continuation protocol. Legacy configs are unchanged.
benchmark_params:
  # The mathematical cavity has singular top corners. Use the same explicit
  # regularization in the target and hard-boundary output transform.
  lid_corner_regularization_width: 0.02

model:
  # The smooth low-Re starting problem converges more reliably with the
  # standard tanh MLP. The Fourier backbone remains an opt-in shared study.
  architecture: mlp
  output_dim: 2
  hidden_layers: [64, 64, 64]
  # Reliable cavity uses a hard-boundary streamfunction-pressure ansatz:
  # psi_total = psi_lift + envelope_psi * raw_psi, u=psi_y, v=-psi_x.
  # This keeps continuity near autograd tolerance while preserving the
  # regularized lid and stationary walls. The older velocity hard-boundary and
  # plain streamfunction formulations remain available only as ablations.
  physics_formulation: hard_boundary_streamfunction_pressure
  hard_boundary_corner_width: 0.06
  hard_boundary_lid_vertical_power: 3
  hard_boundary_correction_scale: 64

optimizer:
  scheduler:
    enabled: true
    total_steps: 4000
    warmup_steps: 300
    warmup_start_ratio: 0.2
    min_lr_ratio: 0.08
  final_repair:
    # Optional guarded LBFGS repair. It is off by default; when enabled, it is
    # accepted only if the raw reference-free physics validation score improves.
    enabled: false
    score_metric: unweighted_physics_validation_loss
    epochs: 20
    lr: 0.2
    max_iter: 5
    max_eval: 10
    batch_multiplier: 2.0
    residual_fraction: 0.25

training:
  pointwise_reduction: mean
  residual_loss_mode:
    initial: pseudo_huber
    switch_step: 1500
    final: mse
    pseudo_huber_delta: 1.0
  adaptive_cycles: 20
  epochs_per_cycle: 200
  n_collocation: 2048
  n_boundary: 512
  n_data: 0
  log_every: 50
  weights:
    # The component residuals already comprise the PDE objective.
    pde: 0.0
    momentum_u: 1.0
    momentum_v: 1.0
    continuity: 1.0
    bc: 1.0
    u: 0.0
    v: 0.0
    p: 0.0
    omega: 0.0
    pressure_gradient: 0.0
    speed_cap: 0.1
    raw_psi_l2: 0.0001
    pressure_gradient_l2: 0.0001
    vorticity_smoothness: 0.0

losses:
  speed_cap:
    enabled: true
    cap: 2.0
  raw_psi_l2:
    enabled: true
  pressure_gradient_l2:
    enabled: true
  vorticity_smoothness:
    enabled: false

cavity_curriculum:
  enabled: true
  stages:
    - until_step: 1000
      corner_width: 0.08
      lid_vertical_power: 3
      correction_scale: 64
    - until_step: 3000
      corner_width: 0.06
      lid_vertical_power: 3
      correction_scale: 64
    - until_step: 4000
      corner_width: 0.05
      lid_vertical_power: 3
      correction_scale: 64

loss_normalization:
  enabled: false
  names: [momentum_u, momentum_v, continuity, bc]
  ema: 0.98
  min_scale: 1.0e-5
  max_scale: 1.0e4
  warmup_steps: 0

controller_v2:
  total_steps: 4000
  # Align every neutral controller boundary with Vanilla's 200-step
  # collocation refresh. When no action is accepted, both trajectories are
  # therefore exactly identical.
  warmup_steps: 800
  control_blocks: 16
  block_steps: 200
  probe_steps: 10
  gradient_probe_interior: 256
  gradient_probe_boundary: 64
  counterfactual_probe_enabled: true
  counterfactual_target_margin: 0.005
  counterfactual_guard_margin: 0.02
  guard_metrics:
    - pde_residual_mean
    - continuity_residual_mean
    - momentum_residual_mean
    - boundary_condition_error
    - unweighted_physics_validation_loss
    - streamfunction_consistency_rmse
    - centerline_pde_residual_mean
    - centerline_continuity_residual_mean
    - corner_pde_residual_mean

continuation_anchor:
  enabled: false

continuation_replay:
  enabled: true
  n_points: 1024
  active_fraction: 0.10
  initial_weight: 0.10
  fields: velocity
  seed_offset: 104729

sampling:
  uniform:
    engine: sobol
  cavity_boundary:
    enabled: true
    mode: balanced
    lid_fraction: 0.25
    corner_fraction: 0.0
    corner_width: 0.08

checkpoint:
  restore_best_before_final: true
  score_mode: sum
  reference_free_metrics:
    - pde_residual_mean
    - momentum_residual_mean
    - boundary_condition_error
  metric_floor: 1.0e-8

convergence_early_stopping:
  enabled: true
  # These are minimums, not fixed budgets. A stage automatically continues to
  # the full 4000-step ceiling whenever validity or stability is not achieved.
  min_steps_initial: 3000
  min_steps_warm_start: 2000
  patience: 3
  relative_tolerance: 0.03
  latest_degradation_tolerance: 0.01

validation:
  nx: 64
  ny: 64

test:
  nx: 96
  ny: 96

visualization:
  # Plotting uses only a forward pass, so a denser grid reveals genuine small
  # corner recirculations without changing training or evaluation metrics.
  nx: 192
  ny: 192

evaluation:
  # PDE residuals are interior equations. Wall accuracy is reported by the
  # separate boundary metrics, so singular lid corners must not be counted
  # twice or dominate controller decisions.
  residual_interior_only: true
  controller_reference_metrics_enabled: false
  checkpoint_reference_metrics_enabled: false

continuation_validity:
  enabled: true
  max_pde_residual_mean: 0.30
  max_continuity_residual_mean: 0.001
  max_momentum_residual_mean: 0.30
  max_boundary_condition_error: 1.0e-8
  max_speed_pred: 2.0
  min_speed_pred_mean: 0.05
  max_streamfunction_consistency_rmse: 0.001
  max_lid_cavity_primary_center_error: 0.10
  max_lid_cavity_topology_score: 0.18
  max_velocity_full_rel_l2: 0.85
  require_lid_cavity_topology_alignment: true
  min_primary_streamfunction_abs: 0.015
  min_detected_vortices: 1
  max_detected_vortices: 2
  min_primary_vortex_wall_distance: 0.05
  max_final_checkpoint_physics_degradation: 0.05
  max_vara_vs_vanilla_physics_degradation: 0.02
