# Opt-in physically guarded continuation protocol. Legacy configs are unchanged.
cavity_base_formulation: uvp_velocity_lift

uvp_velocity_lift:
  continuity_weight: 9.0
  boundary_weight: 0.0
  balanced_boundary_weight: 0.0
  lift_mode: divergence_compatible
  lift_scale: 8.0
  lift_vertical_power: 3
  top_band_pde_weight: 0.6
  top_band_momentum_u_weight: 0.4
  top_band_continuity_weight: 0.4
  upper_core_pde_weight: 0.45
  right_wall_interior_pde_weight: 0.30
  lower_core_pde_weight: 0.25
  wall_residual_tail_weight: 0.06
  raw_pde_tail_weight: 0.05
  diagnostic_boundary_samples: 128
  reliable_boundary_samples: 128
  lid_corner_regularization_widths:
    low_re: 0.05
    mid_re: 0.04
    high_re: 0.03
  diagnostic_polish_steps: 6
  reliable_polish_steps: 30
  diagnostic_validity:
    max_continuity_residual_mean: 0.025
    max_boundary_condition_error: 0.025
  reliable_validity:
    max_continuity_residual_mean: 0.012
    max_boundary_condition_error: 0.015
  checkpoint_metric_weights:
    pde_residual_mean: 1.5
    momentum_residual_mean: 1.5
    core_pde_residual_mean: 1.5
    continuity_residual_mean: 2.0
    near_wall_pde_residual_mean: 1.0
    corner_pde_residual_mean: 0.75
    top_band_pde_residual_mean: 0.75
    upper_core_pde_residual_mean: 0.5

uvp_soft_bc:
  # Momentum is already healthy at Re=100; tighten the two observed weak
  # components without changing the main Adam budget or collocation work.
  continuity_weight: 8.0
  boundary_weight: 0.0
  balanced_boundary_weight: 27.0
  boundary_component_relative_weights:
    bc_top_u: 1.55
    bc_top_v: 1.0
    bc_bottom_u: 1.3
    bc_bottom_v: 1.0
    bc_left_u: 1.1
    bc_left_v: 1.1
    bc_right_u: 1.1
    bc_right_v: 1.1
  diagnostic_boundary_samples: 384
  reliable_boundary_samples: 512
  lid_corner_regularization_widths:
    low_re: 0.05
    mid_re: 0.04
    high_re: 0.03
  diagnostic_polish_steps: 6
  reliable_polish_steps: 30
  diagnostic_validity:
    max_continuity_residual_mean: 0.02
    max_boundary_condition_error: 0.06
  reliable_validity:
    max_continuity_residual_mean: 0.01
    max_boundary_condition_error: 0.03
  checkpoint_metric_weights:
    pde_residual_mean: 1.5
    momentum_residual_mean: 1.5
    core_pde_residual_mean: 1.5
    continuity_residual_mean: 1.25
    boundary_condition_error: 0.75
    u_boundary_rmse: 0.75
    near_wall_pde_residual_mean: 0.5
    near_wall_momentum_v_mean: 0.5
    top_band_pde_residual_mean: 0.75
    top_band_momentum_u_mean: 0.5
    top_band_continuity_residual_mean: 0.5

benchmark_params:
  # The mathematical cavity has singular top corners. Use the same explicit
  # regularization in the target and hard-boundary output transform.
  lid_corner_regularization_width: 0.02

model:
  # The smooth low-Re starting problem converges more reliably with the
  # standard tanh MLP. The Fourier backbone remains an opt-in shared study.
  architecture: mlp
  output_dim: 2
  hidden_layers: [64, 64, 64]
  # Reliable cavity uses a hard-boundary streamfunction-pressure ansatz:
  # psi_total = psi_lift + envelope_psi * raw_psi, u=psi_y, v=-psi_x.
  # This keeps continuity near autograd tolerance while preserving the
  # regularized lid and stationary walls. The older velocity hard-boundary and
  # plain streamfunction formulations remain available only as ablations.
  physics_formulation: hard_boundary_streamfunction_pressure
  hard_boundary_corner_width: 0.08
  hard_boundary_lid_vertical_power: 2
  hard_boundary_correction_scale: 24
  hard_boundary_correction_wall_boost: 8.0

optimizer:
  scheduler:
    enabled: true
    total_steps: 4000
    warmup_steps: 300
    warmup_start_ratio: 0.2
    min_lr_ratio: 0.08
  final_repair:
    # Optional guarded LBFGS repair. It is off by default; when enabled, it is
    # accepted only if the raw reference-free physics validation score improves.
    enabled: false
    score_metric: unweighted_physics_validation_loss
    epochs: 20
    lr: 0.2
    max_iter: 5
    max_eval: 10
    batch_multiplier: 2.0
    residual_fraction: 0.25

training:
  pointwise_reduction: mean
  residual_loss_mode:
    initial: pseudo_huber
    switch_step: 3800
    final: pseudo_huber
    pseudo_huber_delta: 1.0
  adaptive_cycles: 20
  epochs_per_cycle: 200
  n_collocation: 2048
  n_boundary: 64
  n_data: 0
  log_every: 50
  skip_boundary_loss_if_hard_enforced: true
  collocation_curriculum:
    enabled: true
    stages:
      - until_step: 1000
        n_collocation: 1024
        n_boundary: 64
      - until_step: 3000
        n_collocation: 1536
        n_boundary: 64
      - until_step: 4000
        n_collocation: 2048
        n_boundary: 64
  weights:
    # The component residuals already comprise the PDE objective.
    pde: 0.0
    momentum_u: 1.0
    momentum_v: 1.0
    continuity: 1.0
    bc: 0.0
    u: 0.0
    v: 0.0
    p: 0.0
    omega: 0.0
    pressure_gradient: 0.0
    speed_cap: 0.6
    raw_psi_l2: 0.0005
    raw_psi_mean_l2: 0.002
    scaled_correction_mean_l2: 0.02
    scaled_correction_abs_max_hinge: 0.02
    top_reverse_u: 0.07
    bottom_positive_u: 0.04
    raw_pde_tail: 0.08
    pressure_gradient_l2: 0.0001
    vorticity_smoothness: 0.0
    near_wall_vorticity_l2: 0.0002

losses:
  speed_cap:
    enabled: true
    cap: 2.0
  raw_psi_l2:
    enabled: true
  correction_bubble:
    enabled: true
    abs_max_cap: 0.30
  lid_shear_direction:
    enabled: true
    band_width: 0.12
    corner_width: 0.09
    bottom_u_tolerance: 0.04
  raw_residual_tail:
    enabled: true
    threshold: 0.50
    core_margin: 0.08
    core_emphasis: 2.0
  pressure_gradient_l2:
    enabled: true
  near_wall_momentum:
    enabled: true
    normalize_mean: true
    max_weight: 3.0
    stages:
      - until_step: 800
        band_width: 0.12
        weight: 1.00
      - until_step: 1800
        band_width: 0.12
        weight: 1.25
      - until_step: 3000
        band_width: 0.12
        weight: 1.50
      - until_step: 4000
        band_width: 0.12
        weight: 1.50
  near_wall_vorticity_l2:
    enabled: true
    band_width: 0.12
    quantile: 0.95
  vorticity_smoothness:
    enabled: false

cavity_curriculum:
  enabled: true
  stages:
    - until_step: 1000
      corner_width: 0.10
      lid_vertical_power: 2
      correction_scale: 18
    - until_step: 3000
      corner_width: 0.09
      lid_vertical_power: 2
      correction_scale: 22
    - until_step: 4000
      corner_width: 0.09
      lid_vertical_power: 2
      correction_scale: 22

# Materialized per Reynolds number by run_vara_v2_continuation.py before a
# method is selected, so Vanilla and VARA receive exactly the same physics.
re_aware_cavity:
  enabled: true
  near_wall_band:
    scale: 1.2
    min: 0.025
    max: 0.12
  regimes:
    - max_re: 200
      corner_widths: [0.10, 0.09, 0.09]
      lid_vertical_powers: [2, 2, 2]
      correction_scales: [18, 22, 22]
      speed_cap_weight: 0.60
      raw_psi_l2_weight: 0.0005
      raw_psi_mean_l2_weight: 0.002
      scaled_correction_mean_l2_weight: 0.02
      scaled_correction_abs_max_hinge_weight: 0.02
      scaled_correction_abs_max_cap: 0.30
      top_reverse_u_weight: 0.07
      bottom_positive_u_weight: 0.04
      raw_pde_tail_weight: 0.08
      raw_pde_tail_threshold: 0.50
      raw_pde_tail_core_emphasis: 2.0
      near_wall_vorticity_l2_weight: 0.0002
      near_wall_fraction: 0.20
      near_wall_momentum_weights: [1.00, 1.15, 1.25, 1.25]
      topology:
        max_primary_center_error: 0.10
        max_topology_score: 0.18
        require_alignment: true
        max_detected_vortices: 2
    - max_re: 600
      corner_widths: [0.09, 0.08, 0.07]
      lid_vertical_powers: [2, 2, 3]
      correction_scales: [20, 26, 28]
      speed_cap_weight: 0.45
      raw_psi_l2_weight: 0.0003
      raw_psi_mean_l2_weight: 0.001
      scaled_correction_mean_l2_weight: 0.01
      scaled_correction_abs_max_hinge_weight: 0.01
      scaled_correction_abs_max_cap: 0.40
      top_reverse_u_weight: 0.015
      bottom_positive_u_weight: 0.01
      raw_pde_tail_weight: 0.05
      raw_pde_tail_threshold: 0.75
      raw_pde_tail_core_emphasis: 1.5
      near_wall_vorticity_l2_weight: 0.0001
      near_wall_fraction: 0.40
      near_wall_momentum_weights: [1.00, 1.35, 1.75, 1.75]
      topology:
        max_primary_center_error: 0.16
        max_topology_score: 0.28
        require_alignment: false
        max_detected_vortices: 4
    - max_re: .inf
      corner_widths: [0.07, 0.06, 0.05]
      lid_vertical_powers: [2, 3, 3]
      correction_scales: [24, 30, 32]
      speed_cap_weight: 0.30
      raw_psi_l2_weight: 0.00015
      raw_psi_mean_l2_weight: 0.0002
      scaled_correction_mean_l2_weight: 0.002
      scaled_correction_abs_max_hinge_weight: 0.002
      scaled_correction_abs_max_cap: 0.60
      top_reverse_u_weight: 0.0
      bottom_positive_u_weight: 0.0
      raw_pde_tail_weight: 0.02
      raw_pde_tail_threshold: 1.00
      raw_pde_tail_core_emphasis: 1.25
      near_wall_vorticity_l2_weight: 0.00005
      near_wall_fraction: 0.50
      near_wall_momentum_weights: [1.00, 1.35, 1.75, 1.75]
      topology:
        max_primary_center_error: 0.25
        max_topology_score: 0.40
        require_alignment: false
        max_detected_vortices: 8

loss_normalization:
  enabled: false
  names: [momentum_u, momentum_v, continuity, bc]
  ema: 0.98
  min_scale: 1.0e-5
  max_scale: 1.0e4
  warmup_steps: 0

controller_v2:
  total_steps: 4000
  # Align every neutral controller boundary with Vanilla's 200-step
  # collocation refresh. When no action is accepted, both trajectories are
  # therefore exactly identical.
  warmup_steps: 800
  control_blocks: 16
  block_steps: 200
  probe_steps: 10
  gradient_probe_interior: 256
  gradient_probe_boundary: 32
  # Reliable cavity comparisons use one in-budget trust probe only. Running a
  # separate neutral counterfactual branch would add hidden optimizer work.
  counterfactual_probe_enabled: false
  counterfactual_target_margin: 0.005
  counterfactual_guard_margin: 0.02
  guard_metrics:
    - pde_residual_mean
    - continuity_residual_mean
    - momentum_residual_mean
    - boundary_condition_error
    - unweighted_physics_validation_loss
    - streamfunction_consistency_rmse
    - centerline_pde_residual_mean
    - centerline_continuity_residual_mean
    - corner_pde_residual_mean
    - near_wall_pde_residual_mean
    - near_wall_momentum_v_mean
    - speed_pred_max
    - omega_abs_95p
    - near_wall_p_grad_mean

continuation_anchor:
  enabled: false

continuation_replay:
  enabled: true
  n_points: 1024
  active_fraction: 0.10
  initial_weight: 0.10
  fields: velocity
  seed_offset: 104729

sampling:
  uniform:
    engine: sobol
  cavity_near_wall:
    enabled: true
    fraction: 0.30
    band_width: 0.12
  cavity_boundary:
    enabled: true
    mode: balanced
    lid_fraction: 0.25
    corner_fraction: 0.0
    corner_width: 0.08

checkpoint:
  restore_best_before_final: true
  eligible_final_fraction: 0.25
  require_final_cavity_stage: true
  save_latest_every_cycle: false
  score_mode: sum
  reference_free_metrics:
    - pde_residual_mean
    - momentum_residual_mean
    - core_pde_residual_mean
    - boundary_condition_error
    - near_wall_pde_residual_mean
    - near_wall_momentum_v_mean
    - omega_abs_95p
  metric_weights:
    pde_residual_mean: 1.0
    momentum_residual_mean: 1.0
    core_pde_residual_mean: 2.0
    boundary_condition_error: 1.0
    near_wall_pde_residual_mean: 0.5
    near_wall_momentum_v_mean: 0.5
    omega_abs_95p: 0.02
  speed_hinge_weight: 1.0
  low_re_vortex_tiebreaker:
    enabled: true
    max_re: 200
    detected_vortex_limit: 2
    secondary_vortex_limit: 1
    detected_vortex_weight: 0.05
    secondary_vortex_weight: 0.05
  metric_floor: 1.0e-8

pressure_gauge:
  # Removes the pressure nullspace without using reference data.
  weight: 0.001

convergence_early_stopping:
  enabled: true
  # These are minimums, not fixed budgets. A stage automatically continues to
  # the full 4000-step ceiling whenever validity or stability is not achieved.
  min_steps_initial: 3000
  min_steps_warm_start: 2000
  patience: 3
  relative_tolerance: 0.03
  latest_degradation_tolerance: 0.01

validation:
  nx: 64
  ny: 64

test:
  nx: 96
  ny: 96

visualization:
  # Plotting uses only a forward pass, so a denser grid reveals genuine small
  # corner recirculations without changing training or evaluation metrics.
  nx: 192
  ny: 192

evaluation:
  # PDE residuals are interior equations. Wall accuracy is reported by the
  # separate boundary metrics, so singular lid corners must not be counted
  # twice or dominate controller decisions.
  residual_interior_only: true
  controller_reference_metrics_enabled: false
  checkpoint_reference_metrics_enabled: false
  controller_streamfunction_metrics: false
  topology_interval_cycles: 5

runtime_profiling:
  enabled: true
  detailed_every_steps: 50

continuation_validity:
  enabled: true
  max_pde_residual_mean: 0.30
  max_continuity_residual_mean: 0.001
  max_momentum_residual_mean: 0.30
  max_boundary_condition_error: 1.0e-8
  max_speed_pred: 2.2
  min_speed_pred_mean: 0.05
  max_streamfunction_consistency_rmse: 0.001
  max_lid_cavity_primary_center_error: 0.10
  max_lid_cavity_topology_score: 0.18
  require_lid_cavity_topology_alignment: true
  min_primary_streamfunction_abs: 0.015
  min_detected_vortices: 1
  max_detected_vortices: 2
  max_near_wall_pde_residual_mean: 3.0
  max_near_wall_momentum_v_mean: 3.0
  max_core_pde_residual_mean: 0.35
  min_primary_vortex_wall_distance: 0.05
  max_final_checkpoint_physics_degradation: 0.05
  max_vara_vs_vanilla_physics_degradation: 0.02
